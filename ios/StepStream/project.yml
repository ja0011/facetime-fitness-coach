# XcodeGen spec. The checked-in StepStream.xcodeproj is generated from this:  cd ios/StepStream && xcodegen
name: StepStream
options:
  bundleIdPrefix: com.hackuta
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  StepStream:
    type: application
    platform: iOS
    sources:
      - StepStream
    settings:
      base:
        # Must be unique to you. If Xcode says it is unavailable, change the last part.
        PRODUCT_BUNDLE_IDENTIFIER: com.hackuta.stepstream.k7q2
        INFOPLIST_FILE: StepStream/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
